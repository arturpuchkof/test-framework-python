[project]
name = "test-framework-python"
version = "0.1.0"
description = "Test framework for UI an API tests"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.62.0",
    "pydantic>=2.13.5",
    "pytest>=9.1.1",
    "requests>=2.34.2",
]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["api: api tests"]
