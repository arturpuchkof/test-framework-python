[project]
name = "test-framework-python"
version = "0.1.0"
description = "Test framework for UI an API tests"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "allure-pytest>=2.16.2",
    "paho-mqtt>=2.1.0",
    "playwright>=1.62.0",
    "pydantic>=2.13.5",
    "pytest>=9.1.1",
    "pytest-playwright>=0.9.0",
    "pytest-xdist>=3.8.0",
    "requests>=2.34.2",
]
[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true } }]
[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "--alluredir=allure-results --clean-alluredir"
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s - %(levelname)s - %(message)s"
testpaths = ["tests"]
markers = ["api: api tests",
            "ui: ui tests"]
